# FinnWordNet is the largest OMW lexicon after English. kaikki publishes no
# Finnish edition, so the enrichment is the English edition's Finnish section
# only -- which, Finnish being Finnish, is mostly inflection tables.

id = "fi-en"
source_lang = "fi"
target_lang = "en"
tier = 4
name = "Finnish to English"
bookname = "fi-en"
basename = "fi-en"
description = """\
Finnish to English, generated by inverting the WordNet pivot and \
enriched with the Finnish section of the English Wiktionary. Includes an inflection index."""

[pivot]
source_side = "omw-fi"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-fi-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-fi-en"]

[benchmark]
frequency_list = "freq/fi_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Finnish top 50k (hermitdave/FrequencyWords)"

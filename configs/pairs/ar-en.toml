# The reverse of en-ar. Arabic WordNet lemmas resolved to Princeton synsets and
# back out to English, with the English edition's Arabic section on top for
# prose and the conjugation tables. kaikki publishes no Arabic edition, so there
# are no own-edition translation tables here.

id = "ar-en"
source_lang = "ar"
target_lang = "en"
tier = 4
name = "Arabic to English"
bookname = "ar-en"
basename = "ar-en"
description = """\
Arabic to English, generated by inverting the WordNet pivot through the Arabic \
WordNet and enriched with the Arabic section of the English Wiktionary. Includes \
an inflection index."""

[pivot]
source_side = "omw-arb"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-ar-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-ar-en"]

[benchmark]
frequency_list = "freq/ar_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Arabic top 50k (hermitdave/FrequencyWords)"

# Tier 3. Same shape as pt-es with MultiWordNet on the far side.

id = "pt-it"
source_lang = "pt"
target_lang = "it"
tier = 3
name = "Portuguese to Italian"
bookname = "pt-it"
basename = "pt-it"
description = """\
Portuguese to Italian, generated through the WordNet interlingual pivot: \
no direct Portuguese-Italian resource is involved."""

[pivot]
source_side = "omw-pt"
target_side = "omw-it"
gloss_providers = ["pwn30"]
gloss_langs = ["it", "pt", "en"]
keep_gloss_only = false
max_translations = 5

# The edition's own translation tables and form tables, laid over the pivot.
# Curated by speakers of the source language, and the only inflection index
# a pair with no English on the left can have.
[[enrich]]
source = "wikt-pt-to-it"
add_new_headwords = true

[inflections]
from_sources = ["wikt-pt-def"]

[benchmark]
frequency_list = "freq/pt_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Portuguese top 50k (hermitdave/FrequencyWords)"

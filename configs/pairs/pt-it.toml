# Tier 3. Same shape as pt-es with MultiWordNet on the far side.

id = "pt-it"
source_lang = "pt"
target_lang = "it"
tier = 3
name = "Portuguese to Italian"
bookname = "pt-it"
basename = "pt-it"
description = """\
Portuguese to Italian, generated through the WordNet interlingual pivot: \
no direct Portuguese-Italian resource is involved."""

[pivot]
source_side = "omw-pt"
target_side = "omw-it"
gloss_providers = ["pwn30"]
gloss_langs = ["it", "pt", "en"]
keep_gloss_only = false
max_translations = 5

[benchmark]
frequency_list = "freq/pt_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Portuguese top 50k (hermitdave/FrequencyWords)"

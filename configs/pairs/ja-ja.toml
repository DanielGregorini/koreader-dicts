# Monolingual: Japanese defined in Japanese. Nothing here is translated.
#
# The Japanese Wiktionary's own pages about Japanese words. The gloss is a
# definition, the entry's bold line is its synonyms, and its form tables give
# the pair a real inflection index.

id = "ja-ja"
source_lang = "ja"
target_lang = "ja"
tier = 2
name = "Japanese monolingual"
bookname = "ja-ja"
basename = "ja-ja"
description = """\
Japanese defined in Japanese, taken from the Japanese \
Wiktionary. Definitions and synonyms only: nothing is translated. Includes an \
inflection index."""

[[enrich]]
source = "wikt-ja-def"
add_new_headwords = true

# Forms also come from the English edition's section for this language: its
# conjugation and declension tables are language-internal, whatever the
# gloss language, and are often fuller than the edition's own.
# The Japanese edition keeps its lemma pages in kana and makes the kanji page a
# pointer (走る -> はしる), while the English edition's tables name the kanji
# lemma (走った -> 走る). Following that alias is what joins the two.
[inflections]
from_sources = ["wikt-ja-def", "wikt-ja-en"]
follow_aliases = true

[benchmark]
frequency_list = ""
frequency_list_name = ""

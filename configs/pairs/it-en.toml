# The reverse direction, and the one reverse pair that can be enriched: the
# English Wiktionary's Italian section supplies English prose for Italian
# headwords, and its form tables give this pair an inflection index that
# the English morphological rules could never produce.

id = "it-en"
source_lang = "it"
target_lang = "en"
tier = 4
name = "Italian to English"
bookname = "it-en"
basename = "it-en"
description = """\
Italian to English, generated by inverting the WordNet pivot and enriched \
with the Italian section of the English Wiktionary. Includes an inflection index."""

[pivot]
source_side = "omw-it"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-it-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-it-en"]

[benchmark]
frequency_list = "freq/it_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Italian top 50k (hermitdave/FrequencyWords)"

# The reverse of en-es, and the most-read language that had no way out.

id = "es-en"
source_lang = "es"
target_lang = "en"
tier = 4
name = "Spanish to English"
bookname = "es-en"
basename = "es-en"
description = """\
Spanish to English, generated by inverting the WordNet pivot and \
enriched with the Spanish section of the English Wiktionary and the \
Spanish edition's own translation tables. Includes an inflection index."""

[pivot]
source_side = "omw-es"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-es-en"
add_new_headwords = true

[[enrich]]
source = "wikt-es-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-es-en", "wikt-es-def"]

[benchmark]
frequency_list = "freq/es_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Spanish top 50k (hermitdave/FrequencyWords)"

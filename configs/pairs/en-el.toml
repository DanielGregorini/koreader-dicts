# Greek Wordnet carries Greek definitions, so they are preferred over the
# English gloss where they exist.

id = "en-el"
source_lang = "en"
target_lang = "el"
tier = 1
name = "English to Greek"
bookname = "en-el"
basename = "en-el"
description = """\
English to Greek, built by pivoting Princeton WordNet 3.0 through \
the Greek wordnet and enriching with the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "pwn30"
target_side = "omw-el"
gloss_providers = ["omw-el", "pwn30"]
gloss_langs = ["el", "en"]
keep_gloss_only = true
max_translations = 5

[[enrich]]
source = "wikt-en-el"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-el"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"

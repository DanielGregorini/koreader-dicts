# Japanese Wordnet carries Japanese definitions, so they are preferred over the
# English gloss where they exist.

id = "en-ja"
source_lang = "en"
target_lang = "ja"
tier = 1
name = "English to Japanese"
bookname = "en-ja"
basename = "en-ja"
description = "English to Japanese, built by pivoting Princeton WordNet 3.0 through the Japanese wordnet in the Open Multilingual Wordnet."

[pivot]
source_side = "pwn30"
target_side = "omw-ja"
gloss_providers = ["omw-ja", "pwn30"]
gloss_langs = ["ja", "en"]
keep_gloss_only = true
max_translations = 5

# The English edition's translation tables, and the forms that come with them.
[[enrich]]
source = "wikt-en-ja"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-ja"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"

# The reverse of en-fr: WOLF lemmas resolved to Princeton synsets and back
# out to English. CeCILL-C, so no Wiktionary enrichment and no inflection
# index -- the rules are English-only and would apply to the wrong side.

id = "fr-en"
source_lang = "fr"
target_lang = "en"
tier = 4
name = "French to English"
bookname = "fr-en"
basename = "fr-en"
description = """\
French to English, generated by inverting the WordNet pivot through WOLF. \
Distributed under CeCILL-C."""

[pivot]
source_side = "omw-fr"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[benchmark]
frequency_list = "freq/fr_50k.txt"
frequency_list_name = "OpenSubtitles 2018 French top 50k (hermitdave/FrequencyWords)"

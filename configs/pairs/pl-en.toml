# The reverse of en-pl, enriched the same way it-en is.

id = "pl-en"
source_lang = "pl"
target_lang = "en"
tier = 4
name = "Polish to English"
bookname = "pl-en"
basename = "pl-en"
description = """\
Polish to English, generated by inverting the WordNet pivot through \
plWordNet and enriched with the Polish section of the English Wiktionary. \
Includes an inflection index."""

[pivot]
source_side = "omw-pl"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-pl-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-pl-en"]

[benchmark]
frequency_list = "freq/pl_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Polish top 50k (hermitdave/FrequencyWords)"

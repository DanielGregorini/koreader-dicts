# Tier 4: the reverse direction. Same call, arguments swapped.

id = "pt-en"
source_lang = "pt"
target_lang = "en"
tier = 4
name = "Portuguese to English"
bookname = "pt-en"
basename = "pt-en"
description = """\
Portuguese to English, generated by inverting the WordNet pivot: OpenWN-PT \
lemmas resolved to Princeton WordNet synsets and back out to English."""

[pivot]
source_side = "omw-pt"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

# The edition's own translation tables and form tables, laid over the pivot.
# Curated by speakers of the source language, and the only inflection index
# a pair with no English on the left can have.
# The English edition's Portuguese section: English prose for Portuguese
# headwords, and the fullest conjugation tables available.
[[enrich]]
source = "wikt-pt-en"
add_new_headwords = true

[[enrich]]
source = "wikt-pt-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-pt-en", "wikt-pt-def"]

[benchmark]
frequency_list = "freq/pt_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Portuguese top 50k (hermitdave/FrequencyWords)"

# Japanese Wordnet is one of the largest OMW lexicons. Headwords are kanji and
# kana as written; the English edition's form tables add the readings and
# conjugated forms. No Japanese frequency list is published, so coverage is
# not measured for this pair.

id = "ja-en"
source_lang = "ja"
target_lang = "en"
tier = 4
name = "Japanese to English"
bookname = "ja-en"
basename = "ja-en"
description = """\
Japanese to English, generated by inverting the WordNet pivot and \
enriched with the Japanese section of the English Wiktionary and the \
Japanese edition's own translation tables. Includes an inflection index."""

[pivot]
source_side = "omw-ja"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-ja-en"
add_new_headwords = true

[[enrich]]
source = "wikt-ja-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-ja-en", "wikt-ja-def"]

[benchmark]
frequency_list = ""
frequency_list_name = ""

# Greek Wordnet is Apache-2.0, whose notice travels into the ATTRIBUTION file.

id = "el-en"
source_lang = "el"
target_lang = "en"
tier = 4
name = "Greek to English"
bookname = "el-en"
basename = "el-en"
description = """\
Greek to English, generated by inverting the WordNet pivot and \
enriched with the Greek section of the English Wiktionary and the \
Greek edition's own translation tables. Includes an inflection index."""

[pivot]
source_side = "omw-el"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-el-en"
add_new_headwords = true

[[enrich]]
source = "wikt-el-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-el-en", "wikt-el-def"]

[benchmark]
frequency_list = "freq/el_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Greek top 50k (hermitdave/FrequencyWords)"

# Open Dutch WordNet, CC BY-SA 4.0.

id = "nl-en"
source_lang = "nl"
target_lang = "en"
tier = 4
name = "Dutch to English"
bookname = "nl-en"
basename = "nl-en"
description = """\
Dutch to English, generated by inverting the WordNet pivot and \
enriched with the Dutch section of the English Wiktionary and the \
Dutch edition's own translation tables. Includes an inflection index."""

[pivot]
source_side = "omw-nl"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-nl-en"
add_new_headwords = true

[[enrich]]
source = "wikt-nl-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-nl-en", "wikt-nl-def"]

[benchmark]
frequency_list = "freq/nl_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Dutch top 50k (hermitdave/FrequencyWords)"

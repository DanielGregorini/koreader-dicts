# Arabic WordNet is CC BY-SA 3.0, which upgrades to 4.0, so it bundles with
# Wiktionary without trouble.

id = "en-ar"
source_lang = "en"
target_lang = "ar"
tier = 1
name = "English to Arabic"
bookname = "en-ar"
basename = "en-ar"
description = """\
English to Arabic, built by pivoting Princeton WordNet 3.0 through the \
Arabic WordNet and enriching with the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "pwn30"
target_side = "omw-arb"
gloss_providers = ["omw-arb", "pwn30"]
gloss_langs = ["ar", "en"]
keep_gloss_only = true
max_translations = 5

# The English edition's translation tables: wider than the wordnet,
# shallower per entry, and the only bulk source of inflected forms.
[[enrich]]
source = "wikt-en-ar"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-ar"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"

# Indonesian has the only wordnet of the seven languages added here, so it is
# the only one of them that pivots. Wordnet Bahasa is MIT, which resolves
# against the CC BY-SA Wiktionary layer to CC BY-SA 4.0.

id = "id-en"
source_lang = "id"
target_lang = "en"
tier = 4
name = "Indonesian to English"
bookname = "id-en"
basename = "id-en"
description = """\
Indonesian to English, generated by inverting the WordNet pivot through \
Wordnet Bahasa and enriched with the Indonesian section of the English \
Wiktionary and the Indonesian edition's own translation tables. Includes an \
inflection index."""

[pivot]
source_side = "omw-id"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-id-en"
add_new_headwords = true

[[enrich]]
source = "wikt-id-to-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-id-en", "wikt-id-def"]

[benchmark]
frequency_list = "freq/id_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Indonesian top 50k (hermitdave/FrequencyWords)"

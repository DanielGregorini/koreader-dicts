# Hungarian has no wordnet in OMW 1.4, so there is nothing to pivot
# through and this pair is the English edition's translation tables alone.
#
# WordNet is still named below: its exception files supply the irregular
# English forms (went -> go) that no rule derives.

id = "en-hu"
source_lang = "en"
target_lang = "hu"
tier = 2
name = "English to Hungarian"
bookname = "en-hu"
basename = "en-hu"
description = """\
English to Hungarian, built from the English Wiktionary's translation \
tables. Includes an inflection index."""

[[enrich]]
source = "wikt-en-hu"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-hu"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"

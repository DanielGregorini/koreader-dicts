# Tier 3, the mirror of es-it.

id = "it-es"
source_lang = "it"
target_lang = "es"
tier = 3
name = "Italian to Spanish"
bookname = "it-es"
basename = "it-es"
description = """\
Italian to Spanish, generated through the WordNet interlingual pivot: \
no direct Italian-Spanish resource is involved."""

[pivot]
source_side = "omw-it"
target_side = "omw-es"
gloss_providers = ["pwn30"]
gloss_langs = ["es", "it", "en"]
keep_gloss_only = false
max_translations = 5

# The edition's own translation tables and form tables, laid over the pivot.
# Curated by speakers of the source language, and the only inflection index
# a pair with no English on the left can have.
[[enrich]]
source = "wikt-it-to-es"
add_new_headwords = true

[inflections]
from_sources = ["wikt-it-def"]

[benchmark]
frequency_list = "freq/it_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Italian top 50k (hermitdave/FrequencyWords)"

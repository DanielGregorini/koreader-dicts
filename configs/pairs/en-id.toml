# Wordnet Bahasa is MIT and Wiktionary is CC BY-SA 4.0; the two resolve to
# CC BY-SA 4.0, so the pivot and the enrichment can ship in one file.
#
# The Indonesian wordnet carries 4,139 Indonesian definitions of its own, so
# it is listed ahead of Princeton: where it has one, the reader gets a gloss
# in Indonesian rather than in English.

id = "en-id"
source_lang = "en"
target_lang = "id"
tier = 1
name = "English to Indonesian"
bookname = "en-id"
basename = "en-id"
description = """\
English to Indonesian, built by pivoting Princeton WordNet 3.0 through \
Wordnet Bahasa and enriching with the English Wiktionary's translation \
tables. Includes an inflection index."""

[pivot]
source_side = "pwn30"
target_side = "omw-id"
gloss_providers = ["omw-id", "pwn30"]
gloss_langs = ["id", "en"]
keep_gloss_only = true
max_translations = 5

[[enrich]]
source = "wikt-en-id"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-id"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"

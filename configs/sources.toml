# --- Wiktionary via kaikki.org (wiktextract) --------------------------------
#
# Deliberately unpinned. kaikki regenerates these dumps as Wiktionary changes,
# so a fixed sha256 would break every scheduled rebuild rather than protect
# anything. The checksum of whatever was actually used is recorded in the build
# metadata instead, which is what reproducibility needs here.

[[source]]
id = "wikt-pt"
kind = "kaikki"
path = "kaikki/ptwiktionary.jsonl.gz"
lang = "pt"
url = "https://kaikki.org/ptwiktionary/raw-wiktextract-data.jsonl.gz"
license_id = "CC-BY-SA-4.0"
credit = "Portuguese Wiktionary via kaikki.org (wiktextract)"
options = { mode = "foreign_entries", source_lang = "en", target_lang = "pt" }

# The English edition, ~500 MB compressed. It is the only bulk source of
# English inflected forms, which is what fills the .syn file. `translations`
# mode filters the translation tables to one target language, so there is one
# declaration per target -- they all share the same file on disk.


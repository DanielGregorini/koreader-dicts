# --- Monolingual: each edition defining its own language -------------------
#
# Same files as above, read a third way. `definitions` mode keeps the pages a
# Wiktionary edition writes about its own language, so the gloss is a real
# definition rather than an equivalent, and the synonym lists become the
# entry's synonyms. Nothing is translated anywhere in this section.

# Already on disk for the bilingual pairs; only the mode differs.
[[source]]

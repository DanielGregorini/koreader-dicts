# Data sources.
#
# Nothing here is committed to the repository -- `kdicts fetch` downloads into
# the data root, and builds publish to GitHub Releases. `sha256` pins the
# artifact: leave it empty for a first run, then paste in what `kdicts fetch`
# reports. A scheduled rebuild against an unpinned source can silently change
# what a published dictionary contains.
#
# LICENSING: every wordnet carries its own terms. `license_id` here is checked
# against what the data file itself declares, and a mismatch is a hard error --
# it means upstream changed the terms under a dictionary we already published.

# --- English spine ----------------------------------------------------------

[[source]]
id = "pwn30"
kind = "wordnet"
path = "wordnet/dict"
lang = "en"
version = "3.0"
# The full source tarball, not WNdb-3.0.tar.gz: WNdb ships only the index and
# data files, and we also need the hand-curated exception files (noun.exc,
# verb.exc, adj.exc, adv.exc) that map "went" to "go". Nothing else generates
# those, and without them the inflection index misses every irregular.
url = "https://wordnetcode.princeton.edu/3.0/WordNet-3.0.tar.gz"
sha256 = "640db279c949a88f61f851dd54ebbb22d003f8b90b85267042ef85a3781d3a52"
archive_member = "WordNet-3.0/dict"
license_id = "WordNet-3.0"
credit = "Princeton University WordNet 3.0"

# --- Open Multilingual Wordnet 1.4 -----------------------------------------
#
# All lexicons come out of one archive; `archive_member` picks the one file.
# The licences below are what each lexicon declares in its own <Lexicon
# license="..."> attribute. They are not uniform and must not be assumed to be:
#
#   CC BY-SA 3.0   arb, lt, sk, sl
#   CC BY-SA 4.0   nl
#   CC BY-SA (unversioned, read as 4.0)   pt, ro
#   CC BY 3.0      bg, ca, es, eu, fi, gl, hr, is, it, sq, sv
#   WordNet        cmn, da, he, ja, nb, nn, pl, th, en
#   MIT            id, zsm
#   Apache-2.0     el
#   ODC-By-1.0     iwn
#   CeCILL-C       fr   <-- CANNOT be bundled with CC BY-SA material
#
# German is absent from OMW 1.4 entirely; en->de needs OdeNet added separately.

[[source]]
id = "omw-pt"
kind = "omw-lmf"
path = "omw/omw-pt/omw-pt.xml"
lang = "pt"
version = "1.4"
url = "https://github.com/omwn/omw-data/releases/download/v1.4/omw-1.4.tar.xz"
sha256 = "28be99fcb038171403cd057f62e7213d1ea4ea1cf00ab2fb99af190f39bb1d99"
archive_member = "omw-1.4/omw-pt/omw-pt.xml"
license_id = "CC-BY-SA-4.0"
credit = "OpenWN-PT (de Paiva & Rademaker), via Open Multilingual Wordnet 1.4"

